<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shared Bookmarks</title>
  </head>
  <body>
    <header>
      <h1>Shared Bookmarks</h1>
    </header>

    <main>
      <!-- user dropdown to choose which bookmarks to display -->
      <section aria-labelledby="user-selection-heading">
        <h2 id="user-selection-heading" class="visually-hidden">
          Select a User
        </h2>

        <label for="user-dropdown">View bookmarks for:</label>
        <select id="user-dropdown">
          <option value="" disabled selected>Choose a user...</option>
          <option value="user1">First User</option>
          <option value="user2">Second User</option>
          <option value="user3">Third User</option>
          <option value="user4">Fourth User</option>
          <option value="user5">Fifth User</option>
        </select>
      </section>

      <hr />

      <!-- form for adding a new bookmark for the selected user -->
      <section aria-labelledby="form-heading">
        <h2 id="form-heading">Add a New Bookmark</h2>
        <form id="bookmark-form" novalidate>
          <div class="form-group">
            <label for="bookmark-url">URL</label>
            <input
              type="url"
              id="bookmark-url"
              required
              placeholder="https://example.com"
            />
          </div>

          <div class="form-group">
            <label for="bookmark-title">Title</label>
            <input
              type="text"
              id="bookmark-title"
              required
              placeholder="Site Title"
            />
          </div>

          <div class="form-group">
            <label for="bookmark-description">Description</label>
            <textarea
              id="bookmark-description"
              required
              placeholder="Short description of the link..."
            ></textarea>
          </div>

          <button type="submit" id="save-bookmark-btn">Save Bookmark</button>
        </form>
      </section>

      <hr />

      <section aria-labelledby="display-heading">
        <h2 id="display-heading">Bookmarks</h2>
        <p id="status-message" aria-live="polite">
          Please select a user to view bookmarks.
        </p>

        <!-- bookmark list is updated dynamically in the script -->
        <ul id="bookmarks-list" aria-busy="false"></ul>
      </section>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
